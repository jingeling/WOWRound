<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>WOWRound</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/room.js"></script>
</head>
<body class="room-page">
  <svg class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></symbol>
      <symbol id="i-mic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M9 9v1a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.7M5 10a7 7 0 0 0 11.3 5.5M19 10a7 7 0 0 1-.6 2.8M12 17v4"/></symbol>
      <symbol id="i-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></symbol>
      <symbol id="i-cam-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M16 16H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2M10 6h4a2 2 0 0 1 2 2v4l6-3v10"/></symbol>
      <symbol id="i-screen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4M9 10.5l3-3 3 3M12 7.5v6"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4zM14 7l3 3"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
      <symbol id="i-hangup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15.5c5-4.7 13-4.7 18 0l-2.4 2.4-3.3-1.7v-2.6a12 12 0 0 0-6.6 0v2.6l-3.3 1.7z"/></symbol>
    </defs>
  </svg>

  <div class="topline">
    <span class="room-name" id="room-name"></span>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>

  <main class="stage" id="stage">
    <div class="idle" id="idle"><p id="idle-text"></p></div>
    <div class="screen-wrap" id="screen-wrap" hidden>
      <video id="screen-video" autoplay playsinline muted></video>
      <canvas class="annotate" id="annotate" aria-label="Aanwijslaag over het gedeelde scherm"></canvas>
    </div>
    <div class="bubbles" id="bubbles"></div>
  </main>

  <nav class="controls" id="controls" aria-label="Bediening" hidden>
    <button class="ctl toggle-off-bad" id="btn-mic" aria-pressed="true" title="Microfoon (M)"><svg><use href="#i-mic"/></svg></button>
    <button class="ctl toggle-off-bad" id="btn-cam" aria-pressed="true" title="Camera (V)"><svg><use href="#i-cam"/></svg></button>
    <button class="ctl toggle-on-good" id="btn-share" aria-pressed="false" title="Venster delen (S)"><svg><use href="#i-screen"/></svg></button>
    <button class="ctl toggle-on-good" id="btn-draw" aria-pressed="false" title="Tekenen op het gedeelde scherm (D)" hidden><svg><use href="#i-pen"/></svg></button>
    <button class="ctl" id="btn-more" aria-expanded="false" aria-controls="menu" title="Meer"><svg><use href="#i-more"/></svg></button>
    <span class="ctl-sep" aria-hidden="true"></span>
    <button class="ctl hangup" id="btn-leave" title="Ophangen"><svg><use href="#i-hangup"/></svg></button>
  </nav>

  <div class="panel menu" id="menu" hidden>
    <div class="field">
      <label for="sel-mic">Microfoon</label>
      <select class="input" id="sel-mic"></select>
    </div>
    <div class="field">
      <label for="sel-cam">Camera</label>
      <select class="input" id="sel-cam"></select>
    </div>
    <button class="btn" id="btn-copy" type="button" hidden>Gastlink kopiëren</button>
  </div>

  <div class="panel knock" id="knock" role="alertdialog" aria-label="Wachtruimte" hidden></div>

  <section class="prejoin" id="prejoin" hidden>
    <div class="prejoin-card">
      <div class="preview" id="preview"></div>
      <h1 id="prejoin-title">Klaar om binnen te komen?</h1>
      <p id="prejoin-text"></p>
      <form id="prejoin-form">
        <div class="field">
          <label for="display-name">Je naam</label>
          <input class="input" id="display-name" maxlength="40" autocomplete="name" required>
        </div>
        <div class="prejoin-toggles">
          <button class="ctl toggle-off-bad" type="button" id="pre-mic" aria-pressed="true" title="Microfoon"><svg><use href="#i-mic"/></svg></button>
          <button class="ctl toggle-off-bad" type="button" id="pre-cam" aria-pressed="true" title="Camera"><svg><use href="#i-cam"/></svg></button>
        </div>
        <p class="error-text" id="prejoin-error" role="alert"></p>
        <button class="btn btn-primary" type="submit" id="prejoin-submit">Binnenkomen</button>
      </form>
    </div>
  </section>

  <section class="ended" id="ended" hidden>
    <div>
      <h1 id="ended-title">Gesprek beëindigd</h1>
      <p id="ended-text"></p>
      <button class="btn btn-primary" id="btn-rejoin" type="button">Opnieuw binnenkomen</button>
    </div>
  </section>
</body>
</html>
