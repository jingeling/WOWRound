<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Inloggen · WOWRound</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script type="module" src="/assets/js/login.js"></script>
</head>
<body>
  <main class="login">
    <form id="login-form" novalidate>
      <div class="mark" aria-hidden="true"><span class="dot"></span><span class="dot"></span></div>
      <span class="wordmark">WOWRound</span>
      <div class="field">
        <label for="password">Wachtwoord</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <p class="error-text" id="error" role="alert"></p>
      <button class="btn btn-primary" type="submit">Inloggen</button>
    </form>
  </main>
</body>
</html>
